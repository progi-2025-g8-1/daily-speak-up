services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - default

  supertokens:
    image: registry.supertokens.io/supertokens/supertokens-postgresql:latest
    ports:
      - "3567:3567"
    environment:
      POSTGRESQL_CONNECTION_URI: "${SUPERTOKENS_DATABASE_URL}"
      API_KEYS: "${SUPERTOKENS_API_KEY}"
    restart: unless-stopped
    networks:
      - default

  backend:
    build:
      context: backend
      dockerfile: Dockerfile
    ports:
      - "8123:8123"
    restart: unless-stopped
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-dev}
      - DATABASE_URL=${DATABASE_URL}
      - SUPERTOKENS_DATABASE_URL=${SUPERTOKENS_DATABASE_URL}
      - SUPERTOKENS_CONNECTION_URI=${SUPERTOKENS_CONNECTION_URI:-http://supertokens:3567}
      - SUPERTOKENS_API_KEY=${SUPERTOKENS_API_KEY}
      - API_DOMAIN=${API_DOMAIN:-http://backend:8123}
      - WEBSITE_DOMAIN=${WEBSITE_DOMAIN:-http://frontend:5173}
      - API_BASE_PATH=${API_BASE_PATH:-/auth}
      - APP_NAME=${APP_NAME:-DailySpeakUp}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL_ID=${GEMINI_MODEL_ID:-gemini-2.0-flash-exp}
      - BACKEND_URL=${BACKEND_URL}
      - FRONTEND_URL=${FRONTEND_URL}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL:-auth@dailyspeak.app}
      - RABBIT_MQ_URL=${RABBIT_MQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-rpc://}
      - CELERY_RATE_LIMIT=${CELERY_RATE_LIMIT:-2/s}
      - BUCKET_NAME=${BUCKET_NAME}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ADMIN_API_KEY=${R2_ADMIN_API_KEY}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_JURISDICTION=${R2_JURISDICTION}
      - ROOT_ADMIN_EMAIL=${ROOT_ADMIN_EMAIL}
      - ROOT_ADMIN_PASSWORD=${ROOT_ADMIN_PASSWORD}
      - ROOT_ADMIN_HANDLE=${ROOT_ADMIN_HANDLE}
    depends_on:
      - supertokens
    networks:
      - default

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_DOMAIN=${VITE_API_DOMAIN:-http://localhost:8123}
        - VITE_WEBSITE_DOMAIN=${VITE_WEBSITE_DOMAIN:-http://localhost:5173}
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8123/api/v1}
        - VITE_ROOT_ADMIN_EMAIL=${VITE_ROOT_ADMIN_EMAIL:-admin@dailyspeak.app}
        - VITE_ROOT_ROLE=${VITE_ROOT_ROLE:-root}
        - VITE_ADMIN_ROLE=${VITE_ADMIN_ROLE:-admin}
        - VITE_MODERATOR_ROLE=${VITE_MODERATOR_ROLE:-mod}
        - VITE_USER_ROLE=${VITE_USER_ROLE:-user}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - default

  celery_worker:
    build:
      context: backend
      dockerfile: Dockerfile
    command: celery -A src.services.email_impl.celery_app:app worker -l INFO --concurrency=1
    depends_on:
      - backend
      - rabbitmq
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-dev}
      - DATABASE_URL=${DATABASE_URL}
      - SUPERTOKENS_DATABASE_URL=${SUPERTOKENS_DATABASE_URL}
      - SUPERTOKENS_CONNECTION_URI=${SUPERTOKENS_CONNECTION_URI:-http://supertokens:3567}
      - SUPERTOKENS_API_KEY=${SUPERTOKENS_API_KEY}
      - API_DOMAIN=${API_DOMAIN:-http://backend:8123}
      - WEBSITE_DOMAIN=${WEBSITE_DOMAIN:-http://frontend:5173}
      - API_BASE_PATH=${API_BASE_PATH:-/auth}
      - APP_NAME=${APP_NAME:-DailySpeakUp}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL_ID=${GEMINI_MODEL_ID:-gemini-2.0-flash-exp}
      - BACKEND_URL=${BACKEND_URL}
      - FRONTEND_URL=${FRONTEND_URL}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL:-auth@dailyspeak.app}
      - RABBIT_MQ_URL=${RABBIT_MQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-rpc://}
      - CELERY_RATE_LIMIT=${CELERY_RATE_LIMIT:-2/s}
    networks:
      - default
